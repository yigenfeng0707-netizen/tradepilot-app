# Optional P2+ infra — Redis (Celery) + MinIO (object storage).
# Default app path stays sync/local when these are down.
# Usage:
#   docker compose up -d
#   docker compose ps
#   docker compose down

services:
  redis:
    image: redis:7-alpine
    container_name: tradepilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: tradepilot-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tradepilot_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # One-shot: create bucket `tradepilot` after MinIO is healthy
  minio-init:
    image: minio/mc:latest
    container_name: tradepilot-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/tradepilot &&
      mc anonymous set download local/tradepilot || true &&
      echo 'bucket tradepilot ready'
      "
    restart: "no"

volumes:
  tradepilot_minio_data:
